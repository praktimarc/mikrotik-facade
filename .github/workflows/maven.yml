name: Java CI with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify with Maven
        run: mvn -B -U clean verify --file pom.xml
      - name: Check low-level API boundary and tracked sensitive files
        shell: bash
        run: |
          if git grep -n 'me\.legrange\.mikrotik\.impl\.' -- src/main/java; then
            echo "::error::Forbidden low-level internal API reference"
            exit 1
          fi
          if git ls-files | grep -Ei '[.](jar|jks|keystore|p12|pfx|pem|key)'; then
            echo "::error::Tracked dependency binary or sensitive key material"
            exit 1
          fi
      - name: Generate Java API documentation
        run: mvn -B -U org.apache.maven.plugins:maven-javadoc-plugin:3.11.2:javadoc --file pom.xml
      - name: Scan incoming commits for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan current checkout for secrets (Gitleaks)
        run: gitleaks dir . --redact --no-banner --exit-code=2
